<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1E1C19"/>
      <stop offset="100%" stop-color="#0E0D0B"/>
    </radialGradient>
    <linearGradient id="goldRule" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFD5C3"/>
      <stop offset="50%" stop-color="#B8A892"/>
      <stop offset="100%" stop-color="#DFD5C3"/>
    </linearGradient>
    <filter id="inkGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Ink Silhouette with Broadsheet Radius -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Oxford Border -->
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="url(#goldRule)" stroke-width="4" stroke-opacity="0.45"/>
  <!-- Inner Oxford Fine Rule -->
  <rect x="42" y="42" width="428" height="428" rx="74" fill="none" stroke="url(#goldRule)" stroke-width="1.5" stroke-opacity="0.65"/>

  <!-- Editorial Monogram Group -->
  <g filter="url(#inkGlow)">
    <!-- Classic Broadsheet Serif "D" (The Digital Times) -->
    <path d="M 124 120 L 254 120 C 344 120 404 175 404 256 C 404 337 344 392 254 392 L 124 392 L 124 354 L 164 354 L 164 158 L 124 158 Z" fill="#F2EEE5"/>
    <!-- Inner Counter -->
    <path d="M 230 178 L 230 334 L 256 334 C 314 334 350 298 350 256 C 350 214 314 178 256 178 Z" fill="#131210"/>
    
    <!-- Top Serif Chisel Highlight -->
    <path d="M 124 120 L 254 120 L 246 132 L 164 132 L 164 158 L 124 158 Z" fill="#FFFFFF" fill-opacity="0.2"/>
  </g>

  <!-- Telegraph Wire Crimson Live Rosette -->
  <circle cx="396" cy="120" r="34" fill="#A71919"/>
  <circle cx="396" cy="120" r="26" fill="#C92A2A"/>
  <circle cx="396" cy="120" r="14" fill="#FAF7F0"/>
  <circle cx="396" cy="120" r="6" fill="#A71919"/>
</svg>
